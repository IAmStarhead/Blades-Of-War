<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Template: форма и тона</title><style>*{box-sizing:border-box}body{margin:0;background:#292f32;color:#eee;font:15px system-ui;text-align:center}h1{font-size:20px;margin:10px 0 4px}p{margin:4px;color:#c5cac6}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px}button{background:#46504b;border:1px solid #919b8c;color:#fff;border-radius:4px;padding:7px 11px}.labels{display:grid;grid-template-columns:1fr 1fr;max-width:800px;margin:auto;font-weight:600}#view{height:min(76vh,780px);min-height:420px}canvas{width:100%;height:100%;display:block}</style><h1>Character Template: форма и тона</h1><p>Отдельная проба — слева оригинал, справа изменение</p><nav><button data-sex="Male">Мужчина</button><button data-sex="Female">Женщина</button><button data-angle="0">Спереди</button><button data-angle="0.65">Три четверти</button><button data-angle="1.57">Профиль</button><button data-angle="-0.65">Другая сторона</button><button data-light="-1">Свет слева</button><button data-light="1">Свет справа</button><button data-focus="face">Лицо</button><button data-focus="body">Весь рост</button><button data-tones="1">С тонами</button><button data-tones="0">Без тонов лица</button></nav><div class="labels"><span>Оригинал Template</span><span>Проба</span></div><div id="view"></div><script type="module" src="./study.js"></script></html>
