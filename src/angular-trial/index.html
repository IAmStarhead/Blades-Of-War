<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проба формы и света</title><style>*{box-sizing:border-box}body{margin:0;background:#252c2e;color:#eee7dd;font:16px system-ui}header{text-align:center;padding:14px 10px 2px}h1{font-size:21px;margin:0 0 4px}p{margin:4px;color:#c7c4bd}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}button{background:#444e4a;border:1px solid #94998a;border-radius:5px;color:white;padding:8px 15px;cursor:pointer}.labels{display:grid;grid-template-columns:repeat(2,1fr);text-align:center;max-width:1000px;margin:auto;font-weight:600}.viewport{height:min(72vw,760px);min-height:500px}canvas{display:block;width:100%;height:100%}footer{text-align:center;color:#bbb7b0;font-size:13px;padding:8px}</style></head><body><header><h1>Проба: более спокойный облик</h1><p>Теплее кожа · отдельное бельё · расслабленная поза · лёгкая угловатость</p><nav><button data-focus="body">Весь рост</button><button data-focus="face">Лица</button><button data-view="front">Спереди</button><button data-view="three">Три четверти</button><button data-view="side">Профиль</button><button data-view="back">Сзади</button></nav></header><div class="labels"><span>Женщина</span><span>Мужчина</span></div><div id="view" class="viewport"></div><footer>Статичная проба: не редактор, не игровые персонажи; сохранённые стандарты не изменены.</footer><script type="module" src="./study.js"></script></body></html>
