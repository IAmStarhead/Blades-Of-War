<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080b10" />
  <title>Blades Of War — Студёный Брод (0.0.9.3 · Low-Poly 3D)</title>
  <style>/* ============================================================
   BLADES OF WAR — оформление прототипа 0.0.7
   Палитра: холодный камень, серебро, воронёная сталь, бордо.
   Схема: верхняя палка + выдвижная панель + рельса значков.
   Адаптив: компьютер → планшет → телефон.
   ============================================================ */

:root {
  /* Палитра: холодный камень, серебро, воронёная сталь, бордо.
     Никаких охристо-бурых тонов, которые читаются как «грязные». */

  --bow-bg:        #0f1215;   /* почти чёрный с холодным синим */
  --bow-bg-deep:   #0a0c0e;
  --bow-panel:     #161a1e;   /* камень в тени */
  --bow-panel-2:   #1d2227;   /* камень на свету */
  --bow-line:      #333d45;   /* шов кладки */
  --bow-line-soft: #262e35;

  --bow-text:      #dbe1e6;   /* светлый холодный серый */
  --bow-dim:       #939ca5;   /* камень светлее */
  --bow-faint:     #68727a;   /* камень тёмнее */

  --bow-silver:    #c8d2da;   /* серебро — заголовки */
  --bow-steel:     #7f929f;   /* воронёная сталь */

  --bow-gold:      #c9a961;   /* латунь как акцент, дозированно */
  --bow-gold-dim:  #8a7440;

  --bow-bordo:     #7d2b33;   /* бордо — королевский акцент */
  --bow-bordo-dim: #561d23;

  --bow-good:      #6f9478;   /* мох — хорошо */
  --bow-ok:        #a8b0a0;
  --bow-low:       #c08b4e;   /* тёплый янтарь — предупреждение */
  --bow-crit:      #b04a45;   /* ржавчина — опасно */

  --bow-warm:      #8fae8a;
  --bow-cold:      #b0736a;

  --bow-mono: "Courier New", "Nimbus Mono PS", monospace;
  --bow-serif: Georgia, "Times New Roman", serif;

  --bow-radius: 2px;

  /* Поверхности: одна шкала глубины вместо россыпи оттенков.
     Сцена — самая светлая, поле ввода и жёлоб полос — самые тёмные.
     Все холодные: ни одного коричневого тона. */
  --bow-surface-1: #131a20;   /* жёлоб, вдавленное */
  --bow-surface-2: #171f26;   /* поле, карточка в тени */
  --bow-surface-3: #1b242c;   /* карточка, кнопка */
  --bow-surface-4: #202b34;   /* наведение, приподнятое */
  --bow-surface-5: #253139;   /* активное */

  /* Тени: вместо рамок там, где нужна глубина */
  --bow-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --bow-shadow-md: 0 6px 18px rgba(0, 0, 0, 0.38);
  --bow-shadow-lg: 0 18px 48px rgba(0, 0, 0, 0.55);

  /* Шкала отступов: 4 / 6 / 8 / 12 / 16 / 22 */
  --bow-s1: 4px;
  --bow-s2: 6px;
  --bow-s3: 8px;
  --bow-s4: 12px;
  --bow-s5: 16px;
  --bow-s6: 22px;

  /* Межстрочный интервал для чтения длинного текста */
  --bow-leading: 1.62;

/* ============================================================
   ЗАТУХАНИЕ СЦЕНЫ
   При смене пассажа сцена гаснет и проявляется заново.
   Реализовано на CSS-анимации, класс вешает интерфейс.
   ============================================================ */
@keyframes bow-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes bow-veil {
  0%   { opacity: 0.85; }
  100% { opacity: 0; }
}

/* Смена сцены: короткая тень поверх, затем проявление.
   Только прозрачность — она не вызывает морской болезни и
   не глушится настройкой «уменьшить движение» у большинства людей. */
.bow-scene.bow-scene-fade {
  animation: bow-fade-in 320ms ease-out both;
}

/* Завеса живёт в каркасе, а не в разметке пассажа: раньше она была
   описана в CSS, но ни разу не создавалась в DOM — потому переходы
   и «не работали». */
.bow-veil-run {
  animation: bow-veil 320ms ease-out forwards;
}

/* Короткая «завеса» поверх сцены — как закрывающийся и открывающийся
   взгляд в темноте. Легкая, не мешает читать. */
.bow-veil {
  position: fixed;
  inset: 0;
  background: var(--bow-bg-deep);
  pointer-events: none;
  z-index: 40;
  opacity: 0;
}

/* --- Сброс внутри оболочки SugarCube --- */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bow-bg-deep);
  font-variant-emoji: text;
}

body {
  color: var(--bow-text);
  font-family: var(--bow-serif);
  font-size: 16px;
  line-height: var(--bow-leading);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}

#story, #passages {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

.passage {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

/* --- Каркас --- */
.bow-app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 14px 28px;
  background:
    /* Свечение сверху — холодное, как отражение льда, а не лампа. */
    radial-gradient(1100px 460px at 50% -240px, #1b2530 0%, transparent 72%),
    var(--bow-bg);
  min-height: 100vh;
  box-sizing: border-box;
}

/* ============================================================
   ВЕРХНЯЯ ПАЛКА И ЛОГОТИП-КНОПКА
   ============================================================ */

.bow-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 4px 10px;
  border-bottom: 1px solid var(--bow-line);
  margin-bottom: 12px;
  flex-wrap: wrap;
}

/* Подсказка у логотипа: без неё неочевидно, что это кнопка панели.
   Гаснет при наведении — она нужна один раз, а не постоянно. */
.bow-logo-hint {
  font-family: var(--bow-mono);
  font-size: 0.52rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bow-faint);
  border: 1px solid var(--bow-line-soft);
  border-radius: 3px;
  padding: 2px 5px;
  align-self: center;
  transition: color 0.18s, border-color 0.18s, opacity 0.25s;
}

.bow-logo-btn:hover .bow-logo-hint {
  color: var(--bow-steel);
  border-color: var(--bow-line);
}

.bow-logo-btn[aria-expanded="true"] .bow-logo-hint { opacity: 0; }

@media (max-width: 720px) { .bow-logo-hint { display: none; } }

.bow-logo-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  padding: 4px 8px 4px 4px;
  cursor: pointer;
  border-radius: var(--bow-radius);
  color: inherit;
  text-align: left;
  transition: background 0.18s, box-shadow 0.18s;
  -webkit-tap-highlight-color: transparent;
}

.bow-logo-btn:hover { background: rgba(200, 210, 218, 0.05); }

.bow-logo-btn:focus-visible {
  outline: 2px solid var(--bow-bordo);
  outline-offset: 2px;
}

/* Сам щит: картинка встроена в CSS как data URI */
.bow-logo-img {
  display: block;
  width: 44px;
  height: 44px;
  background-image: var(--bow-logo);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), filter 0.28s;
}

/* Нажали — щит «раскрывается»: лёгкий наклон и свечение */
.bow-logo-btn[aria-expanded="true"] .bow-logo-img {
  transform: scale(1.06) rotate(-3deg);
  filter: drop-shadow(0 0 10px rgba(125, 43, 51, 0.75));
}

.bow-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.bow-logo-text b {
  font-size: 0.92rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bow-silver);
  font-weight: 600;
}

.bow-logo-text i {
  font-style: normal;
  font-family: var(--bow-mono);
  font-size: 0.62rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin-top: 2px;
}

.bow-topbar-info {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  font-family: var(--bow-mono);
  font-size: 0.76rem;
  color: var(--bow-dim);
}

.bow-tb-time { color: var(--bow-text); }
.bow-tb-place { color: var(--bow-silver); }
.bow-tb-sep { color: var(--bow-line); }
.bow-tb-money b { color: var(--bow-gold); }

.bow-weather {
  font-family: var(--bow-mono);
  font-size: 0.7rem;
  color: var(--bow-steel);
  letter-spacing: 0.05em;
  font-style: italic;
}

/* Ход времени: три кнопки в шапке */
.bow-clock-controls {
  display: inline-flex;
  gap: 2px;
  margin-left: 4px;
}

.bow-clock-btn {
  font-family: var(--bow-mono);
  font-size: 0.6rem;
  line-height: 1;
  letter-spacing: -0.05em;
  color: var(--bow-faint);
  background: #141a1f;
  border: 1px solid var(--bow-line-soft);
  border-radius: 3px;
  padding: 4px 5px;
  min-width: 26px;
  min-height: 24px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.bow-clock-btn:hover { color: var(--bow-silver); border-color: var(--bow-line); }

.bow-clock-btn.bow-clock-on {
  color: var(--bow-gold);
  border-color: var(--bow-gold-dim);
  background: #1b2229;
}

/* Мини-полосы в шапке: видны всегда */
.bow-topbar-status {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  flex-wrap: wrap;
}

.bow-mini {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--bow-mono);
  font-size: 0.62rem;
  letter-spacing: 0.04em;
  color: var(--bow-faint);
  text-transform: uppercase;
}

.bow-mini-bar {
  width: 54px;
  height: 5px;
  background: #0b0e10;
  border: 1px solid var(--bow-line-soft);
  overflow: hidden;
}

.bow-mini-fill {
  display: block;
  height: 100%;
  transition: width 0.3s ease;
}

.bow-mini-val { color: var(--bow-dim); min-width: 22px; text-align: right; }

/* ============================================================
   ВЫДВИЖНАЯ ПАНЕЛЬ

   Схема: body — флекс-строка из трёх соседей.
   [рельса] [панель] [сцена]

   Панель анимируется по СВОЕЙ ширине: 12px → 348px. Это важно:
   `auto` в grid-колонках браузер не интерполирует, поэтому
   прежняя схема «grid-template-columns: auto 0 1fr» переключалась
   рывком — панель просто появлялась. Ширина и opacity анимируются
   везде, включая мобильные браузеры с адресной строкой.
   ============================================================ */

.bow-body {
  --bow-drawer-w: 336px;   /* ширина панели в открытом виде */

  display: flex;
  align-items: flex-start;
  gap: 0;
}

/* Панель — сосед сцены во флекс-строке, а не колонка сетки.
   Анимируется её собственная ширина: 0 → 336px. Ширину браузер
   интерполирует плавно, а `auto` в grid-колонке — нет, из-за чего
   панель раньше «телепортировалась» без выезда.
   Отступ от рельсы держит сама рельса: так закрытая панель занимает
   ровно ноль места и не оставляет пустого шва. */
.bow-drawer {
  flex: 0 0 auto;
  box-sizing: border-box;
  width: 0;
  min-width: 0;
  overflow: hidden;
  opacity: 0;
  transition: width 0.34s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.26s ease 0.05s;
}

.bow-body.bow-body-open .bow-drawer {
  width: var(--bow-drawer-w);
  opacity: 1;
}

/* Содержимое держит постоянную ширину (336px без внутреннего отступа):
   при выезде оно не переливается и не перестраивается, а открывается
   вместе с панелью. */
.bow-drawer-scroll {
  width: var(--bow-drawer-w);
  box-sizing: border-box;
  padding-right: 12px;
  max-height: calc(100vh - 130px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--bow-line) transparent;
  padding-right: 2px;
}

.bow-drawer-scroll::-webkit-scrollbar { width: 6px; }
.bow-drawer-scroll::-webkit-scrollbar-thumb { background: var(--bow-line); }

.bow-drawer-inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.bow-dpanel {
  background: linear-gradient(165deg, var(--bow-panel-2), var(--bow-panel) 75%);
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid var(--bow-line);
  border-radius: var(--bow-radius);
  padding: 11px 12px;
  transition: border-left-color 0.2s;
}

.bow-dpanel.bow-dpanel-focus { border-left-color: var(--bow-bordo); }

/* ============================================================
   РЕЛЬСА ЗНАЧКОВ СЛЕВА
   ============================================================ */

.bow-rail {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 0 0 auto;
  position: sticky;
  top: 8px;
  margin-right: 12px;
}

.bow-rail-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 58px;
  padding: 7px 2px 6px;
  cursor: pointer;
  background: linear-gradient(180deg, #1b2127, #151a1f);
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid transparent;
  border-radius: var(--bow-radius);
  color: var(--bow-dim);
  transition: border-color 0.16s, color 0.16s, background 0.16s;
  -webkit-tap-highlight-color: transparent;
}

.bow-rail-btn:hover {
  color: var(--bow-silver);
  background: #1f262e;
  border-left-color: var(--bow-steel);
}

.bow-rail-btn.bow-rail-active {
  color: var(--bow-silver);
  border-left-color: var(--bow-bordo);
  background: #212932;
}

.bow-rail-i { font-size: 1rem; line-height: 1; }

.bow-rail-l {
  font-family: var(--bow-mono);
  font-size: 0.56rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.bow-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* --- Панели --- */
.bow-panel {
  background: linear-gradient(165deg, var(--bow-panel-2), var(--bow-panel) 70%);
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  padding: 12px 13px;
}

.bow-h2 {
  margin: 0 0 10px;
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--bow-steel);
  font-weight: 600;
  border-bottom: 1px solid var(--bow-line-soft);
  padding-bottom: 7px;
}

.bow-h2-gap { margin-top: 18px; }

/* --- Складывающиеся блоки ---
   Заголовок остаётся тем же .bow-h2, но становится кнопкой:
   треугольник справа показывает состояние, курсивных украшений нет. */
.bow-fold {
  border: 0;
  margin: 0;
}

.bow-fold > summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s, border-color 0.15s;
}

.bow-fold > summary::-webkit-details-marker { display: none; }

.bow-fold > summary:hover {
  color: var(--bow-silver);
  border-bottom-color: var(--bow-line);
}

.bow-fold > summary:focus-visible {
  outline: 2px solid var(--bow-steel);
  outline-offset: 3px;
}

/* Уголок вместо треугольника: он читается как металл, а не как маркер. */
.bow-fold-i {
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--bow-steel);
  border-bottom: 1.5px solid var(--bow-steel);
  transform: rotate(-45deg);
  transition: transform 0.2s ease;
  margin-right: 3px;
}

.bow-fold[open] > summary .bow-fold-i { transform: rotate(45deg); }

.bow-fold > summary.bow-h2 { margin-bottom: 0; }

.bow-fold[open] > summary.bow-h2 { margin-bottom: 10px; }

.bow-fold .bow-jobs,
.bow-fold .bow-people,
.bow-fold #passages { margin-bottom: 6px; }

.bow-dim { color: var(--bow-dim); }
.bow-faint { color: var(--bow-faint); }

.bow-empty {
  font-family: var(--bow-mono);
  font-size: 0.74rem;
  color: var(--bow-faint);
  padding: 4px 0;
}

.bow-note {
  margin: 10px 0 0;
  font-size: 0.72rem;
  line-height: 1.45;
  color: var(--bow-faint);
}

/* --- Потребности --- */
.bow-needs { display: flex; flex-direction: column; gap: 9px; }

.bow-need-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.76rem;
  color: var(--bow-dim);
  margin-bottom: 3px;
}

.bow-need-val { font-family: var(--bow-mono); font-size: 0.78rem; }

.bow-bar {
  height: 5px;
  background: var(--bow-surface-1);
  border: 1px solid var(--bow-line-soft);
  overflow: hidden;
}

.bow-fill { display: block; height: 100%; transition: width 0.28s ease; }

.bow-good { color: var(--bow-good); }
.bow-fill.bow-good { background: var(--bow-good); }
.bow-ok { color: var(--bow-ok); }
.bow-fill.bow-ok { background: var(--bow-ok); }
.bow-low { color: var(--bow-low); }
.bow-fill.bow-low { background: var(--bow-low); }
.bow-critical { color: var(--bow-crit); }
.bow-fill.bow-critical { background: var(--bow-crit); }

/* --- Умения --- */
.bow-skills {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.bow-skill-name { color: var(--bow-text); }

/* Полоса умения: видно, далеко ли до сотни, не читая число. */
.bow-skill-bar {
  display: block;
  height: 4px;
  background: var(--bow-surface-1);
  border-radius: 2px;
  overflow: hidden;
}

.bow-skill-bar i {
  display: block;
  height: 100%;
  background: var(--bow-steel);
  transition: width 200ms ease;
}

.bow-skill-low .bow-skill-bar i { background: var(--bow-faint); }
.bow-skill-mid .bow-skill-bar i { background: var(--bow-steel); }
.bow-skill-high .bow-skill-bar i { background: var(--bow-good); }
.bow-skill b { text-align: right; color: var(--bow-silver); font-variant-numeric: tabular-nums; }

.bow-skill {
  display: grid;
  grid-template-columns: 1fr 52px 34px;
  align-items: center;
  gap: 8px;
  font-family: var(--bow-mono);
  font-size: 0.72rem;
  color: var(--bow-dim);
  background: var(--bow-surface-2);
  border: 1px solid var(--bow-line-soft);
  padding: 4px 6px;
}

.bow-skill b { color: var(--bow-silver); }

/* --- Розыск в верхней палке ---
   Пусто, пока за игроком не идут: лишних строк в мирное время нет. */
.bow-heat { display: none; }
.bow-heat.bow-heat-on {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 5px 14px;
  font-size: 0.7rem;
  color: var(--bow-dim);
  border-top: 1px solid var(--bow-line-soft);
  background: var(--bow-surface-1);
}

.bow-heat-line b { color: var(--bow-silver); font-weight: 600; }
.bow-heat-hunted { color: var(--bow-crit); }
.bow-heat-hunted b { color: var(--bow-crit); }

/* --- Тело: постоянные увечья ---
   Тихая, но заметная строка: игрок должен понимать, что это навсегда. */
.bow-injuries { display: flex; flex-direction: column; gap: 4px; }

.bow-injury {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 5px 8px;
  border-left: 2px solid var(--bow-crit);
  background: var(--bow-surface-2);
}

.bow-injury-name {
  font-size: 0.78rem;
  color: var(--bow-text);
  letter-spacing: 0.02em;
}

.bow-injury-effect {
  font-size: 0.68rem;
  color: var(--bow-dim);
}

.bow-injury-note {
  margin-top: 4px;
  font-size: 0.66rem;
  color: var(--bow-faint);
  font-style: italic;
}

/* --- Кража: подготовка и карманы ---
   Три ступени в одном блоке: приглядеться, отвлечь, взять.
   Раньше была одна кнопка, и выбора не было вовсе. */
.bow-steal-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--bow-line-soft);
  width: 100%;
}

.bow-steal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.72rem;
  color: var(--bow-dim);
}
.bow-steal-head b { color: var(--bow-good); font-variant-numeric: tabular-nums; }
.bow-crit-text { color: var(--bow-crit) !important; }

.bow-steal-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.bow-steal-acts .bow-trade-btn { flex: 1 1 auto; min-width: 96px; }

.bow-steal-prep {
  font-size: 0.64rem;
  color: var(--bow-faint);
}
.bow-steal-prep b { color: var(--bow-silver); }

/* --- Лечение --- */
.bow-treat { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }

.bow-treat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.bow-treat-gain {
  font-size: 0.8rem;
  color: var(--bow-good);
  font-variant-numeric: tabular-nums;
}

.bow-treat-note {
  font-size: 0.64rem;
  color: var(--bow-faint);
  line-height: 1.35;
}

/* --- Инвентарь --- */
.bow-inventory { display: flex; flex-direction: column; gap: 4px; }

.bow-inv-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.78rem;
  padding: 3px 0;
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-inv-row .bow-dim { font-family: var(--bow-mono); font-size: 0.68rem; }

.bow-inv-total {
  margin-top: 7px;
  font-family: var(--bow-mono);
  font-size: 0.7rem;
  color: var(--bow-faint);
  text-align: right;
}

/* --- Сцена --- */
.bow-scene {
  background: linear-gradient(165deg, #1e2731, var(--bow-panel) 78%);
  border: 1px solid var(--bow-line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035), var(--bow-shadow-md);
  border-radius: var(--bow-radius);
  padding: 16px 17px 14px;
}

.bow-scene-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--bow-line-soft);
  padding-bottom: 9px;
}

.bow-scene-head h2 {
  margin: 0;
  font-size: 1.06rem;
  letter-spacing: 0.04em;
  color: var(--bow-silver);
  font-weight: 600;
}

.bow-scene-head .bow-dim {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.bow-scene-text p {
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: var(--bow-leading);
  color: var(--bow-text);
  /* Длинные строки на широком экране утомляют: держим меру чтения. */
  max-width: 74ch;
}

.bow-scene-text p:last-child { margin-bottom: 0; }

/* Зачин сцены: первая строка — как открывающая фраза,
   чуть крупнее и светлее остальных. */
.bow-scene-text p:first-child {
  font-size: 1.02rem;
  color: #e4eaf0;
}

/* Первая буква зачина — буквица. Не украшение ради украшения:
   она даёт глазу точку входа в текст. */
.bow-scene-text p:first-child::first-letter {
  float: left;
  font-size: 2.5rem;
  line-height: 0.92;
  padding: 2px 7px 0 0;
  color: var(--bow-gold);
  font-family: var(--bow-serif);
}

.bow-result {
  min-height: 1.1em;
  margin-top: 6px;
  padding-top: 9px;
  border-top: 1px solid var(--bow-line-soft);
  font-family: var(--bow-mono);
  font-size: 0.76rem;
  color: var(--bow-silver);
  white-space: pre-line;
}

/* --- Кнопки --- */
.bow-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.bow-btn {
  appearance: none;
  cursor: pointer;
  font-family: var(--bow-mono);
  font-size: 0.76rem;
  letter-spacing: 0.03em;
  color: var(--bow-text);
  background: linear-gradient(180deg, var(--bow-surface-4), var(--bow-surface-3));
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  padding: 9px 13px;
  min-height: 40px;
  /* Внутренняя световая кромка сверху: кнопка читается как
     выточенная из камня, а не как плоский прямоугольник. */
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045), var(--bow-shadow-sm);
  transition: border-color 0.15s, background 0.15s, color 0.15s,
              box-shadow 0.15s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}

.bow-btn:hover:not(:disabled) {
  border-color: var(--bow-steel);
  color: var(--bow-silver);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), var(--bow-shadow-md);
}

/* Нажатие должно быть чувствительным: кнопка уходит вниз на пиксель
   и теряет тень. Это единственная «физика» в интерфейсе, и её хватает. */
.bow-btn:active:not(:disabled) {
  background: var(--bow-surface-2);
  transform: translateY(1px);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45);
}

.bow-btn:focus-visible {
  outline: 2px solid var(--bow-steel);
  outline-offset: 2px;
}

.bow-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.bow-btn-i { color: var(--bow-silver); margin-right: 6px; }

.bow-btn-sm {
  display: block;
  width: 100%;
  text-align: left;
  font-size: 0.72rem;
  padding: 8px 10px;
  margin-bottom: 6px;
  min-height: 38px;
}

.bow-btn-danger { border-color: #4a2f2a; color: #c08a80; }
.bow-btn-danger:hover:not(:disabled) { border-color: var(--bow-crit); color: var(--bow-crit); }

.bow-saves { display: flex; flex-direction: column; }

/* --- Карточка жителя (исправлена вёрстка 0.0.7.3: на всю ширину без сжатия по центру) --- */
.bow-people,
.bow-all-people {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bow-person {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  width: 100%;
  padding: 10px 12px;
  background: var(--bow-surface-2);
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid var(--bow-steel);
  border-radius: var(--bow-radius);
  cursor: default;
  box-shadow: var(--bow-shadow-sm);
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}

.bow-person:hover {
  background: var(--bow-surface-3);
  box-shadow: var(--bow-shadow-md);
  border-color: var(--bow-line);
  border-left-color: var(--bow-silver);
}

.bow-person-name { font-size: 0.88rem; font-weight: 600; color: var(--bow-text); }

.bow-person .bow-dim {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-faint);
}

.bow-tone {
  font-family: var(--bow-mono);
  font-size: 0.74rem;
}

.bow-warm { color: var(--bow-warm); }
.bow-neutral { color: var(--bow-dim); }
.bow-cold { color: var(--bow-cold); }

.bow-person-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  width: 100%;
}

.bow-person-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
  width: 100%;
}

.bow-person-acts .bow-trade-btn {
  flex: 1 1 92px;
  min-height: 34px;
  text-align: center;
  justify-content: center;
}

/* --- Окно персонажа --- */
.bow-sheet {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(8, 7, 5, 0.78);
  padding: 18px;
  overflow-y: auto;
}

.bow-sheet-open { display: block; }

.bow-sheet-card {
  max-width: 560px;
  margin: 4vh auto;
  background: linear-gradient(170deg, #1d2731, #151c22 82%);
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  padding: 18px 20px 16px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
}

.bow-sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--bow-line-soft);
  padding-bottom: 10px;
}

.bow-sheet-head h3 {
  margin: 0;
  font-size: 1.15rem;
  color: var(--bow-silver);
  letter-spacing: 0.04em;
}

.bow-sheet-close {
  background: none;
  border: 1px solid var(--bow-line);
  color: var(--bow-dim);
  font-size: 0.9rem;
  width: 34px;
  height: 34px;
  cursor: pointer;
  border-radius: var(--bow-radius);
}

.bow-sheet-close:hover { color: var(--bow-crit); border-color: var(--bow-crit); }

.bow-sheet-sub {
  font-family: var(--bow-mono);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin: 9px 0 10px;
}

.bow-sheet-about {
  font-size: 0.92rem;
  line-height: 1.6;
  color: var(--bow-text);
  margin: 0 0 14px;
}

.bow-sheet-block { margin-bottom: 14px; }

.bow-sheet-block h4 {
  margin: 0 0 6px;
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bow-steel);
}

.bow-tag {
  display: inline-block;
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-dim);
  background: var(--bow-surface-2);
  border: 1px solid var(--bow-line-soft);
  padding: 3px 8px;
  margin: 0 5px 5px 0;
  border-radius: var(--bow-radius);
}

.bow-mem {
  font-size: 0.78rem;
  color: var(--bow-dim);
  padding: 4px 0;
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-sheet-acts {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  padding-top: 12px;
  border-top: 1px solid var(--bow-line-soft);
}

.bow-sheet-acts .bow-btn { flex: 1; }

/* --- Торговля --- */
.bow-trade { display: flex; flex-direction: column; gap: 9px; }

.bow-trade-group-title {
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin-bottom: 2px;
}

.bow-trade-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-trade-name { font-size: 0.8rem; }

.bow-trade-price {
  font-family: var(--bow-mono);
  font-size: 0.74rem;
  color: var(--bow-silver);
  white-space: nowrap;
}

.bow-trade-btn {
  font-family: var(--bow-mono);
  font-size: 0.7rem;
  color: var(--bow-text);
  background: var(--bow-surface-3);
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  padding: 6px 10px;
  min-width: 40px;
  min-height: 34px;
  cursor: pointer;
}

.bow-trade-btn:hover:not(:disabled) { border-color: var(--bow-steel); color: var(--bow-silver); }

/* Цена, на которую не хватает монет, — приглушённо-ржавая:
   видно, почему кнопка неактивна, без отдельной подписи. */
.bow-trade-short { color: var(--bow-crit); }
.bow-trade-btn:disabled { opacity: 0.4; cursor: default; }

/* --- Журнал --- */
.bow-journal {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 46vh;
  overflow-y: auto;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--bow-line) transparent;
}

.bow-journal::-webkit-scrollbar { width: 6px; }
.bow-journal::-webkit-scrollbar-thumb { background: var(--bow-line); }

.bow-jrow {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 8px;
  font-size: 0.76rem;
  line-height: 1.45;
  padding-bottom: 5px;
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-jtime {
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  color: var(--bow-faint);
  padding-top: 2px;
}

.bow-jtext { color: var(--bow-dim); }

.bow-kind-danger .bow-jtext { color: #c08a80; }
.bow-kind-need .bow-jtext { color: var(--bow-low); }
.bow-kind-trade .bow-jtext { color: var(--bow-silver); }
.bow-kind-talk .bow-jtext { color: #b6b09c; }
.bow-kind-move .bow-jtext { color: var(--bow-faint); }
.bow-kind-rumour .bow-jtext { color: #a9a084; font-style: italic; }
.bow-kind-system .bow-jtext { color: var(--bow-silver); }

/* --- Заработок --- */
.bow-jobs {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bow-job {
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid var(--bow-steel);
  border-radius: var(--bow-radius);
  background: linear-gradient(170deg, #191f25, #14181d 80%);
  padding: 10px 12px;
}

.bow-job-locked {
  border-left-color: var(--bow-line);
  opacity: 0.72;
}

.bow-job-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}

.bow-job-head b { color: var(--bow-silver); font-weight: 600; }

.bow-job-pay {
  font-family: var(--bow-mono);
  font-size: 0.7rem;
  color: var(--bow-gold);
  white-space: nowrap;
}

.bow-job-note {
  font-size: 0.84rem;
  color: var(--bow-dim);
  line-height: 1.5;
  margin-bottom: 7px;
}

.bow-job-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.05em;
  color: var(--bow-faint);
  margin-bottom: 8px;
}

.bow-job-safe { color: var(--bow-good); }
.bow-job-risky { color: var(--bow-crit); }

.bow-job .bow-btn { width: 100%; }

/* --- Общины --- */
.bow-orgs {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.bow-org {
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  padding: 9px 11px;
  background: rgba(0, 0, 0, 0.16);
}

.bow-org-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.bow-org-head b { color: var(--bow-silver); font-size: 0.88rem; }

.bow-org-word {
  font-family: var(--bow-mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin: 2px 0 7px;
}

/* Шкала отношения: нуль посередине, влево — вражда, вправо — уважение. */
.bow-org-track {
  position: relative;
  height: 6px;
  background: var(--bow-surface-1);
  border: 1px solid var(--bow-line-soft);
  border-radius: 3px;
  overflow: hidden;
}

.bow-org-mid {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--bow-line);
}

.bow-org-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  transition: left 0.3s ease, width 0.3s ease;
}

.bow-org-fill-warm { background: var(--bow-good); }
.bow-org-fill-cold { background: var(--bow-crit); }

.bow-org-legend {
  display: flex;
  justify-content: space-between;
  font-family: var(--bow-mono);
  font-size: 0.54rem;
  letter-spacing: 0.06em;
  color: var(--bow-faint);
  margin-top: 3px;
}

.bow-org-stats {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--bow-line-soft);
  font-family: var(--bow-mono);
  font-size: 0.58rem;
  color: var(--bow-faint);
}

.bow-org-stats b { color: var(--bow-dim); font-weight: 600; }

/* Розыск: единственная шкала, которая появляется только по делу. */
.bow-org-heat {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-family: var(--bow-mono);
  font-size: 0.58rem;
  letter-spacing: 0.05em;
  color: var(--bow-crit);
}

.bow-org-heat-bar {
  flex: 1 1 auto;
  height: 4px;
  background: var(--bow-surface-1);
  border: 1px solid #4a2f2a;
  border-radius: 2px;
  overflow: hidden;
}

.bow-org-heat-bar i {
  display: block;
  height: 100%;
  background: var(--bow-crit);
  transition: width 0.3s ease;
}

/* Кнопка кражи: отдельный, тихий вид. Это не обычное действие. */
.bow-steal-btn {
  border-color: #4a2f2a;
  color: #c08a80;
  font-size: 0.66rem;
}

.bow-steal-btn:hover:not(:disabled) {
  border-color: var(--bow-crit);
  color: var(--bow-crit);
}

.bow-steal-risky { opacity: 0.75; }

/* ============================================================
   БОЙ (0.0.6)
   Окно боя — не всплывающая карточка, а блок в потоке сцены:
   на телефоне ничего не перекрывается, а на компьютере он
   встаёт между сценой и действиями.
   ============================================================ */
.bow-fight { display: none; }

.bow-fight.bow-fight-open { display: block; }

.bow-fight-card {
  border: 1px solid #43302c;
  border-left: 3px solid var(--bow-crit);
  border-radius: var(--bow-radius);
  background: linear-gradient(170deg, #1c1a19, var(--bow-panel) 70%);
  padding: var(--bow-s3) var(--bow-s4);
}

.bow-fight-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: var(--bow-s2);
}

.bow-fight-head b { font-size: 0.95rem; color: var(--bow-silver); }

.bow-fight-head span {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-faint);
}

.bow-fight-odds {
  display: flex;
  flex-wrap: wrap;
  gap: var(--bow-s4);
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-dim);
  padding: var(--bow-s2) 0;
  border-top: 1px dotted var(--bow-line-soft);
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-fight-odds b { color: var(--bow-text); font-weight: 600; }

.bow-fight-rows { display: flex; flex-direction: column; gap: 5px; margin: var(--bow-s2) 0; }

.bow-fight-row {
  display: grid;
  grid-template-columns: 68px 1fr;
  align-items: center;
  gap: var(--bow-s3);
  font-size: 0.72rem;
  color: var(--bow-dim);
}

.bow-fight-bar {
  display: block;
  height: 7px;
  background: var(--bow-surface-1);
  border: 1px solid var(--bow-line-soft);
  border-radius: 2px;
  overflow: hidden;
}

.bow-fight-log {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: var(--bow-s3) 0;
  font-size: 0.76rem;
  color: var(--bow-dim);
}

.bow-fight-line { padding-left: 8px; border-left: 2px solid var(--bow-line-soft); }
.bow-fight-you { border-left-color: var(--bow-steel); color: var(--bow-text); }
.bow-fight-them { border-left-color: #4a2f2a; }
.bow-fight-narr { border-left-color: transparent; color: var(--bow-faint); font-style: italic; }

.bow-fight-note { font-size: 0.72rem; color: var(--bow-faint); }

.bow-fight-warn {
  margin-top: var(--bow-s2);
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.04em;
  color: var(--bow-crit);
}

.bow-fight-acts { display: flex; flex-wrap: wrap; gap: var(--bow-s2); margin-top: var(--bow-s3); }

.bow-fight-danger { border-color: #4a2f2a; color: #c08a80; }
.bow-fight-danger:hover:not(:disabled) { border-color: var(--bow-crit); color: var(--bow-crit); }

.bow-fight-summary { border-left-color: var(--bow-steel); border-color: var(--bow-line); }

/* Кнопка боя в карточке жителя — тихая, но заметная. */
.bow-fight-btn { border-color: #3a3130; }
.bow-fight-btn:hover:not(:disabled) { border-color: var(--bow-crit); color: #c08a80; }

/* Снаряжение: видно, что в руке, а что в запасе. */
.bow-equip-tag {
  margin-left: 6px;
  font-family: var(--bow-mono);
  font-size: 0.58rem;
  letter-spacing: 0.05em;
  color: var(--bow-gold-dim);
}

.bow-loadout {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: var(--bow-s2);
  padding-top: var(--bow-s2);
  border-top: 1px dotted var(--bow-line-soft);
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  color: var(--bow-faint);
}

.bow-loadout b { color: var(--bow-dim); font-weight: 600; }

/* ============================================================
   БОЙ НА ОТДЕЛЬНОЙ СТРАНИЦЕ (0.0.6.1)
   Поле — простая сетка, фишки — прямоугольники с номером.
   Стиль намеренно грубый, как в тактических играх прошлого:
   читается с одного взгляда, ничего лишнего.
   ============================================================ */
.bow-fight-page {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 45;
  overflow-y: auto;
  background: radial-gradient(120% 90% at 50% 0%, #1b2530 0%, var(--bow-bg) 60%, var(--bow-bg-deep) 100%);
  padding: var(--bow-s5) var(--bow-s4) var(--bow-s6);
}

.bow-fight-page.bow-page-open { display: block; }

.bow-fight-page-inner {
  max-width: 980px;
  margin: 0 auto;
}

/* Сцена под боем гаснет: внимание одно. */
.bow-app.bow-in-fight .bow-main { filter: brightness(0.5) saturate(0.7); pointer-events: none; }

/* --- Поле --- */
.bow-arena-wrap {
  display: grid;
  grid-template-columns: 1fr 210px;
  gap: var(--bow-s4);
  margin: var(--bow-s3) 0;
}

.bow-arena {
  display: grid;
  grid-template-columns: repeat(var(--cols, 7), 1fr);
  grid-template-rows: repeat(var(--rows, 3), 1fr);
  gap: 3px;
  padding: 6px;
  background: #0d1216;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  aspect-ratio: 7 / 3;
}

/* Клетки: две тени снега, без картинок и текстур. */
.bow-arena > span {
  border-radius: 1px;
  background: #182027;
}
.bow-arena > span.bow-cell-b { background: #1b242c; }

/* --- Фишка --- */
.bow-chip {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border-radius: 2px;
  font-family: var(--bow-mono);
  transition: opacity 0.15s;
}

.bow-chip-ally { background: #24333d; border: 1px solid #46606f; }
.bow-chip-enemy { background: #38262a; border: 1px solid #6d4148; }

/* --- Отряд: карточки с причинами ---
   Не просто список имён: видно, почему человек идёт или нет. */
.bow-squad-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--bow-faint);
  margin: 10px 0 6px;
}

.bow-squad {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 6px;
}

.bow-squad-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 9px;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  background: var(--bow-surface-2);
  color: var(--bow-text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color 120ms ease, background 120ms ease;
}

.bow-squad-card:hover:not(:disabled) { border-color: var(--bow-steel); background: var(--bow-surface-3); }
.bow-squad-on { border-color: var(--bow-gold-dim); background: var(--bow-surface-3); }
.bow-squad-no { cursor: not-allowed; opacity: 0.62; }

.bow-squad-name { font-size: 0.8rem; color: var(--bow-silver); }
.bow-squad-role { font-size: 0.64rem; color: var(--bow-faint); }

.bow-squad-stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 0.64rem;
  color: var(--bow-dim);
  font-variant-numeric: tabular-nums;
}

.bow-squad-why { font-size: 0.62rem; color: var(--bow-faint); line-height: 1.3; }
.bow-good-text { color: var(--bow-good); }

/* --- Куда бить ---
   Четыре кнопки в ряд. Цифры на них — настоящие шансы из расчёта,
   а не украшение: игрок должен выбирать с открытыми глазами. */
.bow-aim-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 10px 0 4px;
}

.bow-aim-btn {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 6px;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  background: var(--bow-surface-3);
  color: var(--bow-text);
  font-family: inherit;
  font-size: 0.72rem;
  cursor: pointer;
  text-align: center;
  transition: background 120ms ease, border-color 120ms ease;
}

.bow-aim-btn:hover {
  background: var(--bow-surface-4);
  border-color: var(--bow-steel);
}

.bow-aim-btn:active { background: var(--bow-surface-5); }

.bow-aim-name { font-size: 0.76rem; color: var(--bow-silver); }
.bow-aim-hit { color: var(--bow-good); font-variant-numeric: tabular-nums; }
.bow-aim-hurt { color: var(--bow-faint); font-size: 0.62rem; }
.bow-aim-risky .bow-aim-hit { color: var(--bow-crit); }

.bow-aim-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 0.64rem;
  color: var(--bow-faint);
  margin-bottom: 10px;
}
.bow-aim-legend b { color: var(--bow-silver); }

@media (max-width: 720px) {
  .bow-aim-row { grid-template-columns: repeat(2, 1fr); }
  .bow-aim-btn { padding: 10px 6px; }
}

/* Ваша цель: золотая кайма — единственный тёплый акцент,
   и только на враге, которого вы выбрали сами. */
.bow-chip-target {
  border-color: var(--bow-gold);
  box-shadow: 0 0 0 1px var(--bow-gold-dim) inset;
}

.bow-chip[data-act="fight-target"] { cursor: pointer; }
.bow-chip[data-act="fight-target"]:hover { filter: brightness(1.18); }

/* Кого бьют в этом ходу: тонкая рамка и слабый свет.
   Не мигает и не двигается — только заметно. */
.bow-chip-aimed {
  outline: 1px solid var(--bow-crit);
  outline-offset: 2px;
  box-shadow: 0 0 10px rgba(176, 74, 69, 0.35);
}

.bow-chip-body {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 0.78rem;
  color: var(--bow-text);
}

.bow-chip-ally .bow-chip-body { background: #2f4552; border: 1px solid #5b7d90; }
.bow-chip-enemy .bow-chip-body { background: #4a2f34; border: 1px solid #8a5158; }

.bow-chip-hp {
  position: absolute;
  top: -1px;
  right: 1px;
  font-size: 0.6rem;
  color: var(--bow-dim);
}

.bow-chip-name {
  font-size: 0.56rem;
  letter-spacing: 0.02em;
  color: var(--bow-faint);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Нокаут: фишка лежит, над ней звёздочки. */
.bow-chip-down {
  opacity: 0.55;
  transform: rotate(90deg);
}

.bow-chip-down .bow-chip-mark,
.bow-chip-dead .bow-chip-mark {
  position: absolute;
  transform: rotate(-90deg);
  font-size: 0.7rem;
  color: var(--bow-low);
}

.bow-chip-dead { opacity: 0.35; filter: grayscale(1); }
.bow-chip-dead .bow-chip-mark { color: var(--bow-crit); font-size: 0.9rem; }

/* --- Список участников --- */
.bow-roster {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-family: var(--bow-mono);
  font-size: 0.66rem;
}

.bow-roster-row {
  display: grid;
  grid-template-columns: 18px 1fr auto auto;
  gap: 6px;
  align-items: baseline;
  padding: 3px 6px;
  border-left: 2px solid var(--bow-line);
  background: var(--bow-surface-2);
}

.bow-roster-ally { border-left-color: #5b7d90; }
.bow-roster-enemy { border-left-color: #8a5158; }
.bow-roster-hp { color: var(--bow-dim); }
.bow-roster-side { color: var(--bow-faint); font-size: 0.56rem; }

/* --- Окна стражи, клетки, улицы --- */
.bow-guard-card { border-left-color: var(--bow-gold); }
.bow-guard-acts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bow-s2); }
.bow-jail-card { border-left-color: var(--bow-steel); }
.bow-encounter-card { border-left-color: var(--bow-crit); }

/* --- Смерть --- */
.bow-app.bow-dead .bow-main,
.bow-app.bow-dead .bow-body { filter: grayscale(0.8) brightness(0.5); }

.bow-death {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6, 8, 10, 0.92);
  padding: var(--bow-s5);
}

.bow-death-inner { max-width: 46ch; text-align: center; }
.bow-death-inner h2 {
  font-size: 1.6rem;
  letter-spacing: 0.3em;
  color: var(--bow-crit);
  margin: 0 0 var(--bow-s4);
}
.bow-death-inner p { line-height: var(--bow-leading); color: var(--bow-text); }

/* Кнопка-переключатель спутника */
.bow-btn-on { border-color: var(--bow-good); color: var(--bow-good); }

@media (max-width: 720px) {
  .bow-arena-wrap { grid-template-columns: 1fr; }
  .bow-arena { aspect-ratio: 7 / 4; }
  .bow-chip-body { width: 20px; height: 20px; font-size: 0.66rem; }
  .bow-chip-name { display: none; }
  .bow-guard-acts { grid-template-columns: 1fr; }
}

/* --- Подвал --- */
.bow-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: space-between;
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px solid var(--bow-line-soft);
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  color: var(--bow-faint);
}

/* ============================================================
   Адаптив
   ============================================================ */

/* Планшет: рельса становится горизонтальной строкой сверху */
@media (max-width: 900px) {
  .bow-rail {
    flex-direction: row;
    position: static;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }

  .bow-rail-btn {
    flex: 1 1 0;
    min-width: 62px;
    border-left: 1px solid var(--bow-line-soft);
    border-bottom: 2px solid transparent;
  }

  .bow-rail-btn:hover,
  .bow-rail-btn.bow-rail-active {
    border-left-color: var(--bow-line-soft);
    border-bottom-color: var(--bow-bordo);
  }

  /* На узком экране панель не может отнимать место у сцены:
     она наезжает поверх неё и уходит по повторному нажатию. */
  .bow-body {
    flex-direction: column;
    position: relative;
  }

  .bow-rail {
    position: sticky;
    top: 0;
    z-index: 6;
    background: var(--bow-bg);
  }

  /* Панель выезжает из-под горизонтальной рельсы, слева направо:
     рельса остаётся видимой и доступной, пока панель открыта. */
  .bow-drawer {
    position: absolute;
    top: 54px;
    left: 0;
    z-index: 5;
    width: 0;
    padding-right: 0;
    max-height: 72vh;
    border-radius: 0 var(--bow-radius) var(--bow-radius) 0;
    background: var(--bow-panel);
  }

  .bow-body.bow-body-open .bow-drawer {
    width: min(var(--bow-drawer-w), 90vw);
    box-shadow: 14px 0 34px rgba(0, 0, 0, 0.55);
    overflow-y: auto;
  }

  .bow-drawer-scroll {
    width: auto;
    max-width: min(var(--bow-drawer-w), 90vw);
    padding: 8px 10px;
  }

  .bow-body.bow-body-open .bow-drawer-scroll { max-height: none; }

  /* Затемнение под панелью: тап по сцене тоже закрывает её. */
  .bow-body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 4;
    background: rgba(6, 9, 11, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease;
  }

  .bow-body.bow-body-open::after {
    opacity: 1;
    pointer-events: auto;
  }

  .bow-topbar-status { margin-left: 0; width: 100%; }
}

/* Телефон: компактная шапка, крупные тач-цели */
@media (max-width: 720px) {
  body { font-size: 15px; }

  .bow-app { padding: 0 10px 22px; }

  /* На телефоне шапка была в три этажа и уезжала при прокрутке:
     деньги и состояние исчезали из виду ровно тогда, когда нужны.
     Теперь это одна липкая строка: щит, время, место, деньги. */
  .bow-topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    margin-bottom: 8px;
    background: rgba(15, 18, 21, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--bow-line-soft);
  }

  .bow-logo-img { width: 34px; height: 34px; }

  /* Название игры на телефоне не нужно: щит его заменяет. */
  .bow-logo-text { display: none; }

  .bow-topbar-info {
    font-size: 0.66rem;
    gap: 4px;
    width: auto;
    order: 0;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }

  /* Погода — самая длинная часть сводки, на телефоне уступает место. */
  .bow-weather { display: none; }

  .bow-clock-controls { margin-left: 0; }

  .bow-topbar-status {
    gap: 6px;
    margin-left: 0;
    width: auto;
    flex-wrap: nowrap;
    order: 0;
  }

  .bow-mini-bar { width: 30px; }
  .bow-mini { font-size: 0.56rem; gap: 3px; }

  /* Подписи к мини-полосам на телефоне съедают ширину:
     остаются сами полосы и числа. */
  .bow-mini > span:first-child { display: none; }

  /* Кнопки крупнее: палец, а не курсор */
  .bow-btn { flex: 1 1 calc(50% - 7px); font-size: 0.8rem; min-height: 46px; }
  .bow-btn-sm { flex: none; width: 100%; min-height: 44px; }
  .bow-trade-btn { min-height: 40px; min-width: 46px; }

  .bow-person { padding: 10px; }
  .bow-journal { max-height: 300px; }
  .bow-scene { padding: 13px 13px 11px; }
  .bow-scene-text p { font-size: 0.92rem; }
  .bow-rail-btn { min-width: 54px; padding: 8px 2px 7px; }
  .bow-drawer-inner { padding: 2px; }
}

/* Очень узкий экран */
@media (max-width: 380px) {
  .bow-btn { flex: 1 1 100%; }
  .bow-trade-row { grid-template-columns: 1fr auto; }
  .bow-rail-l { display: none; }
  .bow-rail-btn { min-width: 44px; }
}

/* ============================================================
   ДИАЛОГ: лента реплик

   Каждая реплика — отдельная плашка с указанием, кто говорит.
   Реплики игрока справа с бордовой линией,
   реплики собеседника слева со стальной.
   Так видно и то, что сказал ГГ, и то, что ответили ему.
   ============================================================ */

.bow-dialog { display: none; }

.bow-dialog.bow-dialog-open {
  display: block;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  background: linear-gradient(170deg, #1a2027, var(--bow-panel) 80%);
  overflow: hidden;
}

.bow-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bow-line);
  background: rgba(0, 0, 0, 0.25);
}

.bow-dialog-head h3 {
  margin: 0;
  font-size: 0.96rem;
  color: var(--bow-silver);
  letter-spacing: 0.06em;
}

.bow-dialog-meta {
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--bow-faint);
}

.bow-dialog-close {
  background: none;
  border: 1px solid var(--bow-line);
  color: var(--bow-dim);
  width: 30px;
  height: 30px;
  cursor: pointer;
  border-radius: var(--bow-radius);
  flex: 0 0 auto;
}

.bow-dialog-close:hover { color: var(--bow-crit); border-color: var(--bow-crit); }

.bow-dialog-log {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 13px 14px;
  max-height: 42vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--bow-line) transparent;
}

.bow-dialog-log::-webkit-scrollbar { width: 6px; }
.bow-dialog-log::-webkit-scrollbar-thumb { background: var(--bow-line); }

.bow-line {
  max-width: 88%;
  padding: 8px 12px 9px;
  border-radius: var(--bow-radius);
  font-size: 0.9rem;
  line-height: 1.58;
  animation: bow-line-in 0.22s ease both;
}

@keyframes bow-line-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bow-line-npc {
  align-self: flex-start;
  background: #191f25;
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid var(--bow-steel);
  color: var(--bow-text);
}

/* Реплика игрока — самая заметная часть разговора:
   она сдвинута вправо и подписана «Вы», чтобы даже при беглом
   взгляде было видно, что главный герой говорит, а не молчит. */
.bow-line-player {
  align-self: flex-end;
  background: linear-gradient(200deg, #242c35, #1b222a);
  border: 1px solid var(--bow-line);
  border-right: 3px solid var(--bow-bordo);
  color: #d9dfe5;
  box-shadow: -3px 3px 12px rgba(0, 0, 0, 0.3);
}

/* Ремарка: без рамки и подписи, курсивом, с тонкой линией слева.
   Так видно, где говорят, а где просто происходит действие. */
.bow-line-narr {
  align-self: center;
  max-width: 96%;
  background: none;
  border: 0;
  border-left: 1px solid var(--bow-line-soft);
  border-radius: 0;
  padding: 2px 10px;
  color: var(--bow-faint);
  font-style: italic;
  font-size: 0.84rem;
  animation: none;
}


.bow-line-who {
  display: block;
  font-family: var(--bow-mono);
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin-bottom: 3px;
}

.bow-line-player .bow-line-who { color: #a8565f; text-align: right; }

.bow-dialog-choices {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 11px 14px 14px;
  border-top: 1px solid var(--bow-line-soft);
}

.bow-dialog-choices-title {
  font-family: var(--bow-mono);
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin-bottom: 2px;
}

.bow-choice {
  text-align: left;
  cursor: pointer;
  font-family: var(--bow-serif);
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--bow-text);
  background: #1a1f24;
  border: 1px solid var(--bow-line-soft);
  border-left: 2px solid var(--bow-steel);
  border-radius: var(--bow-radius);
  padding: 9px 12px;
  min-height: 40px;
  transition: border-color 0.15s, background 0.15s, color 0.15s, padding-left 0.15s;
}

.bow-choice:hover:not(:disabled) {
  background: #212832;
  border-left-color: var(--bow-bordo);
  color: var(--bow-silver);
  padding-left: 16px;
}

.bow-choice:disabled { opacity: 0.4; cursor: default; }

.bow-choice-leave { border-left-color: var(--bow-line); color: var(--bow-dim); }

.bow-dialog-summary {
  padding: 12px 14px;
  border-top: 1px solid var(--bow-line-soft);
  font-family: var(--bow-mono);
  font-size: 0.76rem;
  color: var(--bow-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.bow-summary-up { color: var(--bow-good); font-weight: 600; }
.bow-summary-down { color: var(--bow-crit); font-weight: 600; }
.bow-summary-flat { color: var(--bow-faint); }

/* --- Внешность в карточке персонажа --- */
.bow-appearance { display: grid; gap: 4px; margin: 0; }

.bow-appearance-row {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 10px;
  font-size: 0.82rem;
  padding: 3px 0;
  border-bottom: 1px dotted var(--bow-line-soft);
}

.bow-appearance-row dt {
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--bow-faint);
  padding-top: 2px;
}

.bow-appearance-row dd { margin: 0; color: var(--bow-dim); }

/* --- Атмосфера сцены --- */
.bow-ambience {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--bow-line-soft);
  font-style: italic;
  font-size: 0.88rem;
  color: var(--bow-faint);
}

/* --- Уважение к настройкам доступности ---
   Отключаем движение там, где оно и есть движение: выезд панели,
   появление диалога, затухание сцены. Не глушим разом весь документ:
   иначе интерфейс «дёргается» вместо того, чтобы просто не двигаться. */
@media (prefers-reduced-motion: reduce) {
  .bow-body,
  .bow-drawer,
  .bow-drawer-scroll,
  .bow-scene,
  .bow-scene-text p,
  .bow-dialog,
  .bow-line,
  .bow-choice,
  .bow-btn,
  .bow-rail-btn {
    transition-duration: 0.001s !important;
    animation-duration: 0.001s !important;
  }
}

@media (prefers-contrast: more) {
  :root {
    --bow-text: #f0ead9;
    --bow-dim: #c2b9a3;
    --bow-line: #5a5142;
  }
}

/* Печать не нужна, но пусть не ломается */
@media print {
  .bow-actions, .bow-saves, .bow-footer { display: none; }
}

.bow-fight-blocked { color: var(--bow-low); }

/* Текущая локация, счётчики блоков и пояснение цен (0.0.6.3) */
.bow-btn.bow-btn-here {
  border-color: var(--bow-bordo);
  background: rgba(139, 50, 62, 0.16);
  color: var(--bow-silver);
}
.bow-btn.bow-btn-here::before {
  content: "• ";
  color: #c96a75;
}
.bow-fold-count {
  margin-left: auto;
  margin-right: 8px;
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  font-weight: 500;
  color: var(--bow-dim);
  padding: 1px 6px;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}
.bow-trade-note {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-dim);
  margin: -2px 0 6px;
}


/* ============================================================
   0.0.7 — НОВЫЙ КАРКАС ЭКРАНА, ГЛАВНОЕ ОКНО СЦЕНЫ И ПОЛУРУЧНОЙ БОЙ
   ============================================================ */

.bow-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.bow-app {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px 28px;
}

/* --- Верхняя шапка в одну линию (по макету 0.0.7) --- */
.bow-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  margin-bottom: 10px;
  background: #0d1116;
  border-bottom: 1px solid var(--bow-line);
  flex-wrap: wrap;
}

.bow-logo-img { width: 36px; height: 36px; }
.bow-logo-text b { font-size: 0.96rem; letter-spacing: 0.12em; }
.bow-logo-text i { display: none; }

.bow-topbar-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--bow-mono);
  font-size: 0.74rem;
  color: var(--bow-dim);
  margin-right: auto;
}

/* Кнопки разделов переехали с левой рельсы в верхнюю шапку */
.bow-rail.bow-top-nav {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 5px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  position: static;
  width: auto;
}

.bow-rail.bow-top-nav .bow-rail-btn {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 48px;
  min-height: 40px;
  padding: 4px 6px;
  background: #141a21;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  color: var(--bow-dim);
  cursor: pointer;
  transition: border-color 0.16s, background 0.16s, color 0.16s;
}

.bow-rail.bow-top-nav .bow-rail-btn:hover {
  background: var(--bow-surface-4);
  border-color: var(--bow-line);
  color: var(--bow-silver);
}

.bow-rail.bow-top-nav .bow-rail-btn.bow-rail-active {
  background: rgba(125, 43, 51, 0.22);
  border-color: var(--bow-bordo);
  color: var(--bow-silver);
}

.bow-rail.bow-top-nav .bow-rail-btn.bow-rail-warn::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bow-crit);
}

/* Крупные читаемые кнопки часов справа в шапке */
.bow-topbar .bow-clock-controls {
  display: inline-flex;
  gap: 5px;
  margin-left: 4px;
}

.bow-topbar .bow-clock-btn {
  min-width: 40px;
  min-height: 40px;
  padding: 6px 8px;
  font-size: 0.78rem;
  background: #141a21;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}

.bow-topbar .bow-clock-btn.bow-clock-on {
  color: var(--bow-gold);
  border-color: var(--bow-gold);
  background: rgba(201, 169, 97, 0.12);
}

/* --- Полоса «Переход» под шапкой --- */
.bow-places-bar {
  background: var(--bow-panel);
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  padding: 8px 12px 10px;
  margin-bottom: 10px;
}

.bow-places-head {
  font-family: var(--bow-mono);
  font-size: 0.65rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bow-dim);
  margin-bottom: 7px;
}

.bow-places-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.bow-places-row .bow-btn {
  min-height: 36px;
  padding: 6px 14px;
  font-size: 0.8rem;
}

/* --- Основное поле без боковой колонки --- */
.bow-body {
  display: block;
  position: relative;
}

.bow-body::after { display: none !important; }

.bow-main { width: 100%; min-width: 0; }

/* --- Главное графическое окно локации (#bow-stage) --- */
.bow-stage {
  position: relative;
  height: 330px;
  background: #0d131a;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: var(--bow-shadow-md);
}

.bow-stage.bow-scene-fade {
  animation: bow-fade-in 320ms ease-out both;
}

.bow-stage-canvas {
  position: absolute;
  inset: 0;
}

.bow-stage-bg {
  width: 100%;
  height: 100%;
  display: block;
}

.bow-stage-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.bow-stage-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 3;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(180deg, rgba(9, 13, 18, 0.82) 0%, rgba(9, 13, 18, 0) 100%);
  pointer-events: none;
}

.bow-stage-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.bow-stage-title h2 {
  margin: 0;
  font-family: var(--bow-serif);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--bow-silver);
}

.bow-stage-title .bow-dim {
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.bow-stage-hint {
  font-family: var(--bow-mono);
  font-size: 0.62rem;
  color: var(--bow-faint);
  letter-spacing: 0.06em;
}

.bow-stage-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  padding: 8px 14px;
  background: linear-gradient(0deg, rgba(9, 12, 16, 0.88) 0%, rgba(9, 12, 16, 0) 100%);
  pointer-events: none;
}

.bow-stage-bottom .bow-ambience {
  margin: 0;
  padding: 0;
  border: 0;
  font-size: 0.8rem;
  color: var(--bow-dim);
}

.bow-stage-bottom .bow-result {
  margin: 2px 0 0;
  padding: 0;
  border: 0;
  background: none;
  font-size: 0.78rem;
  color: var(--bow-gold);
}

/* Кликабельные точки объектов на сцене */
.bow-spot {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 4px 10px;
  background: rgba(15, 20, 26, 0.82);
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  color: var(--bow-text);
  cursor: pointer;
  backdrop-filter: blur(3px);
  transition: border-color 0.16s, background 0.16s, transform 0.16s;
}

.bow-spot:hover,
.bow-spot.bow-spot-on {
  background: rgba(31, 41, 51, 0.94);
  border-color: var(--bow-gold);
  transform: translate(-50%, -52%);
}

.bow-spot-exit { border-style: dashed; }
.bow-spot-exit:hover { border-color: var(--bow-silver); }

.bow-spot-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bow-gold);
  flex-shrink: 0;
}

.bow-spot-exit .bow-spot-dot { background: var(--bow-steel); }

.bow-spot-txt {
  display: flex;
  flex-direction: column;
  text-align: left;
  line-height: 1.15;
}

.bow-spot-txt b {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--bow-silver);
}

.bow-spot-txt i {
  font-style: normal;
  font-family: var(--bow-mono);
  font-size: 0.58rem;
  color: var(--bow-dim);
}

/* Минималистичные фигурки персонажей в Главном окне */
.bow-actor {
  position: absolute;
  transform: translateX(-50%);
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 64px;
  min-height: 44px;
  padding: 4px 6px 22px;
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--bow-text);
  transition: transform 0.18s ease, filter 0.18s ease;
}

.bow-actor:hover,
.bow-actor.bow-actor-on {
  transform: translateX(-50%) translateY(-3px);
  filter: drop-shadow(0 0 8px rgba(201, 169, 97, 0.45));
}

.bow-actor .bow-fig-svg {
  width: 54px;
  height: 74px;
  display: block;
}

.bow-fig-flip { transform: scaleX(-1); }

.bow-actor-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  background: rgba(12, 16, 21, 0.88);
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  white-space: nowrap;
}

.bow-actor-tag i { font-style: normal; }

.bow-actor-hp {
  width: 38px;
  height: 4px;
  background: #0b0e12;
  border: 1px solid var(--bow-line-soft);
}
.bow-actor-hp i { display: block; height: 100%; background: var(--bow-crit); }

/* Всплывающая карточка взаимодействия внутри Главного окна */
.bow-stage-pop {
  display: none;
  position: absolute;
  right: 12px;
  top: 44px;
  z-index: 5;
  width: min(350px, calc(100% - 24px));
  max-height: calc(100% - 56px);
  overflow-y: auto;
}

.bow-stage-pop.bow-stage-pop-open { display: block; }

.bow-stage-card {
  background: rgba(18, 23, 29, 0.96);
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  padding: 10px 12px;
  box-shadow: var(--bow-shadow-lg);
  backdrop-filter: blur(6px);
}

.bow-stage-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 0.86rem;
}

.bow-stage-card-meta {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-dim);
  margin-bottom: 8px;
}

.bow-stage-mini-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 0;
  border-top: 1px solid var(--bow-line-soft);
  font-size: 0.8rem;
}

.bow-gold-txt {
  font-family: var(--bow-mono);
  color: var(--bow-gold);
  white-space: nowrap;
}

@keyframes bow-snow-fall {
  0%   { transform: translate(0, -10px); opacity: 0.2; }
  50%  { opacity: 0.7; }
  100% { transform: translate(-14px, 24px); opacity: 0.15; }
}

.bow-flake { animation: bow-snow-fall 2.8s linear infinite; }
.bow-flake-1 { animation-delay: 0.9s; }
.bow-flake-2 { animation-delay: 1.8s; }

/* --- Приборная полоса героя под Главным окном --- */
.bow-hud-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 12px;
  margin-bottom: 10px;
  background: var(--bow-panel);
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}

.bow-hud-strip .bow-topbar-status {
  margin-left: 0;
  gap: 14px;
}

.bow-hud-acts {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.bow-hud-quick {
  display: inline-flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* --- Вкладки под «Действиями» и карточки работ по макету 0.0.7 --- */
.bow-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--bow-line-soft);
  padding-bottom: 8px;
}

.bow-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 7px 14px;
  background: #141a20;
  border: 1px solid var(--bow-line-soft);
  border-bottom: 2px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
  font-family: var(--bow-mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--bow-dim);
  cursor: pointer;
  transition: color 0.16s, border-color 0.16s, background 0.16s;
}

.bow-tab:hover {
  color: var(--bow-silver);
  background: var(--bow-surface-3);
}

.bow-tab.bow-tab-on {
  color: var(--bow-silver);
  background: #182028;
  border-bottom-color: #a83c48;
}

.bow-tab .bow-fold-count { margin: 0; }

.bow-tab-pane { display: none; }
.bow-tab-pane.bow-tab-pane-on { display: block; }

.bow-job-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 8px;
}

.bow-job-info { flex: 1 1 auto; min-width: 0; }

.bow-job .bow-job-pay {
  font-family: var(--bow-mono);
  font-size: 1.32rem;
  font-weight: 700;
  color: var(--bow-gold);
  white-space: nowrap;
  padding-left: 8px;
}

.bow-job-go { width: 100%; justify-content: flex-start; padding-left: 12px; }

/* --- Всплывающее отдельное окно раздела поверх игры (#bow-drawer.bow-modal) --- */
.bow-drawer.bow-modal {
  position: fixed;
  inset: 0;
  z-index: 45;
  width: 100%;
  max-height: none;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 1;
  background: none;
  overflow: visible;
}

.bow-drawer.bow-modal.bow-modal-open {
  display: flex;
}

.bow-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 9, 13, 0.72);
  backdrop-filter: blur(3px);
}

.bow-modal-box {
  position: relative;
  z-index: 2;
  width: min(560px, 94vw);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  background: var(--bow-panel);
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  box-shadow: var(--bow-shadow-lg);
}

.bow-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--bow-line-soft);
}

.bow-modal-head .bow-h2 { margin: 0; }

.bow-modal-body.bow-drawer-scroll {
  width: 100%;
  max-width: none;
  max-height: calc(82vh - 54px);
  overflow-y: auto;
  padding: 14px 16px;
  box-sizing: border-box;
}

/* Показывается только выбранная вкладка окна */
#bow-drawer.bow-modal .bow-dpanel {
  display: none;
  border: 0;
  padding: 0;
  margin-bottom: 14px;
}

#bow-drawer.bow-modal .bow-dpanel.bow-dpanel-focus {
  display: block;
}

.bow-subh {
  margin: 0 0 8px;
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bow-dim);
}

.bow-all-people {
  display: grid;
  gap: 8px;
}

/* --- Минималистичная панорама боя и тактическая панель Kenshi (0.0.7) --- */
.bow-arena-scene {
  position: relative;
  border: 1px solid var(--bow-line);
  border-radius: var(--bow-radius);
  overflow: hidden;
  background: #0f161e;
}

.bow-arena-scene .bow-stage-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.85;
  pointer-events: none;
}

.bow-arena-scene .bow-arena {
  position: relative;
  z-index: 2;
  background: linear-gradient(180deg, rgba(12, 17, 23, 0.12) 0%, rgba(15, 22, 30, 0.55) 48%, rgba(18, 26, 35, 0.72) 100%);
  min-height: 250px;
  padding: 18px 12px 12px;
}

.bow-arena-scene .bow-cell-a,
.bow-arena-scene .bow-cell-b {
  background: rgba(200, 214, 228, 0.03);
  border: 1px dashed rgba(145, 165, 184, 0.12);
}

.bow-arena-scene .bow-chip {
  background: transparent;
  border: 1px solid transparent;
  padding: 4px;
  min-height: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  transition: transform 0.18s ease, border-color 0.16s ease, background 0.16s ease;
}

.bow-arena-scene .bow-chip-enemy { cursor: pointer; }

.bow-arena-scene .bow-chip-enemy:hover {
  border-color: rgba(201, 169, 97, 0.55);
  background: rgba(201, 169, 97, 0.07);
}

.bow-arena-scene .bow-chip-target {
  border-color: var(--bow-gold);
  background: rgba(201, 169, 97, 0.12);
  box-shadow: 0 0 0 1px rgba(201, 169, 97, 0.35);
}

.bow-chip-ally.bow-chip-strike { transform: translateX(7px); }
.bow-chip-enemy.bow-chip-strike { transform: translateX(-7px); }

.bow-chip-overhead {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 5px;
  background: rgba(10, 14, 18, 0.85);
  border: 1px solid var(--bow-line-soft);
  border-radius: 2px;
  margin-bottom: 2px;
}

.bow-chip-num {
  font-family: var(--bow-mono);
  font-size: 0.62rem;
  color: var(--bow-silver);
}

.bow-chip-hpbar {
  width: 32px;
  height: 4px;
  background: #090c10;
  overflow: hidden;
}

.bow-chip-hpbar i { display: block; height: 100%; }

.bow-arena-scene .bow-chip-body {
  position: relative;
  width: auto;
  height: auto;
  background: none;
  border: 0;
}

.bow-arena-scene .bow-chip-body > b { display: none; }

.bow-arena-scene .bow-fig-svg {
  width: 48px;
  height: 66px;
  display: block;
}

.bow-arena-scene .bow-fig-fallen {
  width: 58px;
  height: 36px;
}

.bow-fight-clock {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 10px;
  margin: 8px 0;
  background: #11161c;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}

.bow-fight-speeds {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.bow-fight-speeds .bow-clock-btn,
.bow-fight-speeds .bow-step-btn {
  min-height: 36px;
  padding: 6px 10px;
  font-size: 0.72rem;
}

.bow-fight-status {
  font-family: var(--bow-mono);
  font-size: 0.68rem;
  color: var(--bow-dim);
}

.bow-aim-btn.bow-aim-on {
  border-color: var(--bow-gold);
  background: rgba(201, 169, 97, 0.13);
}

.bow-orders-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin: 8px 0;
  padding: 8px 10px;
  background: #12181f;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}

.bow-order-group {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.bow-order-label {
  font-family: var(--bow-mono);
  font-size: 0.66rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--bow-faint);
  margin-right: 4px;
}

.bow-btn.bow-order-on {
  border-color: var(--bow-bordo);
  background: rgba(125, 43, 51, 0.24);
  color: var(--bow-silver);
}

@media (max-width: 720px) {
  .bow-topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .bow-rail.bow-top-nav {
    order: 3;
    width: 100%;
    overflow-x: auto;
    justify-content: space-between;
  }
  .bow-rail.bow-top-nav .bow-rail-btn {
    min-width: 42px;
    padding: 4px;
  }
  .bow-stage { height: 250px; }
  .bow-stage-hint { display: none; }
  .bow-job-top { flex-direction: column; align-items: flex-start; gap: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .bow-flake,
  .bow-stage,
  .bow-actor,
  .bow-spot,
  .bow-chip {
    animation-duration: 0.001s !important;
    transition-duration: 0.001s !important;
  }
}


/* ============================================================
   КРУГ 13 (0.0.7.1) — КРУПНЫЙ ГЕРБ-МЕНЮ, НАСТРОЙКИ И ЖИВОЕ ПОЛЕ БОЯ
   ============================================================ */

/* Укрупнённый логотип с клинками — вход в Меню игры */
.bow-topbar .bow-logo-btn {
  gap: 11px;
  padding: 5px 12px 5px 7px;
  border: 1px solid rgba(168, 182, 196, 0.18);
  background: linear-gradient(180deg, rgba(24, 31, 39, 0.85) 0%, rgba(15, 20, 26, 0.92) 100%);
  border-radius: var(--bow-radius);
}

.bow-topbar .bow-logo-btn:hover {
  border-color: rgba(201, 169, 97, 0.55);
  background: linear-gradient(180deg, rgba(31, 40, 50, 0.95) 0%, rgba(19, 25, 33, 0.96) 100%);
}

.bow-topbar .bow-logo-img {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.72));
}

.bow-topbar .bow-logo-btn:hover .bow-logo-img {
  transform: scale(1.06);
  filter: drop-shadow(0 0 10px rgba(201, 169, 97, 0.42));
}

.bow-topbar .bow-logo-text b {
  font-size: 1rem;
  letter-spacing: 0.13em;
}

.bow-topbar .bow-logo-text i {
  display: block;
  font-style: normal;
  font-family: var(--bow-mono);
  font-size: 0.64rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--bow-dim);
  margin-top: 2px;
}

/* --- Меню игры и Настройки --- */
.bow-menu-top {
  margin-bottom: 14px;
}

.bow-menu-resume {
  width: 100%;
  justify-content: center;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 11px 16px;
  border-color: var(--bow-gold);
  background: rgba(201, 169, 97, 0.14);
  color: var(--bow-silver);
}

.bow-menu-resume:hover {
  background: rgba(201, 169, 97, 0.24);
}

.bow-settings {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.bow-setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 10px;
  background: #121820;
  border: 1px solid var(--bow-line-soft);
  border-radius: var(--bow-radius);
}

.bow-setting-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.bow-setting-label b {
  font-size: 0.84rem;
  color: var(--bow-silver);
}

.bow-setting-label span {
  font-size: 0.72rem;
}

.bow-setting-opts {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

/* Режим крупного шрифта из Настроек */
html.bow-font-lg {
  font-size: 18px;
}

/* Спокойный режим сцены (отключает кружение снега и плавное качание) */
html.bow-motion-calm .bow-snow-flake,
html.bow-motion-calm .bow-stage-actor .bow-fig-svg {
  animation: none !important;
}

/* --- Поле боя 0.0.7.1: сближение по снегу без клеток в небе --- */
.bow-arena-scene {
  min-height: 276px;
}

.bow-arena-scene .bow-arena {
  display: block;
  position: relative;
  z-index: 2;
  min-height: 276px;
  aspect-ratio: auto;
  padding: 0;
  border: 0;
  background: linear-gradient(180deg, rgba(12, 17, 23, 0.06) 0%, rgba(15, 22, 30, 0.34) 55%, rgba(16, 24, 33, 0.68) 100%);
}

/* Тонкие вешки шагов на снегу (показывают дистанцию 0..6 без решётки) */
.bow-arena-tracks {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 10px;
  height: 16px;
  pointer-events: none;
}

.bow-snow-step {
  position: absolute;
  bottom: 0;
  width: 28px;
  height: 5px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: rgba(190, 206, 222, 0.14);
  border-bottom: 1px solid rgba(190, 206, 222, 0.25);
}

.bow-arena-scene .bow-chip {
  position: absolute;
  transform: translate(-50%, 0);
  min-width: 68px;
  min-height: 0;
  padding: 3px 5px;
  border-radius: var(--bow-radius);
  transition:
    left 0.36s cubic-bezier(0.22, 1, 0.36, 1),
    top 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.18s ease,
    border-color 0.16s ease,
    background 0.16s ease;
}

.bow-arena-scene .bow-chip-ally.bow-chip-strike {
  transform: translate(calc(-50% + 9px), -2px);
}

.bow-arena-scene .bow-chip-enemy.bow-chip-strike {
  transform: translate(calc(-50% - 9px), -2px);
}

.bow-arena-scene .bow-chip-guard .bow-chip-overhead {
  border-color: rgba(126, 176, 212, 0.65);
}

@media (max-width: 720px) {
  .bow-topbar .bow-logo-img {
    width: 44px;
    height: 44px;
  }
  .bow-arena-scene,
  .bow-arena-scene .bow-arena {
    min-height: 236px;
  }
}


/* ============================================================
   КРУГ 14 (0.0.7.2) — ВЫВЕРЕННЫЕ ОКНА, ТОЧНЫЕ ХИТБОКСЫ И 60 FPS ДОЖДЬ/СНЕГ
   ============================================================ */

/* --- 1. Полноценное центрирование всех модальных окон поверх старых правил --- */
#bow-drawer.bow-modal,
#bow-body.bow-body-open #bow-drawer.bow-modal {
  position: fixed;
  inset: 0;
  top: 0;
  left: 0;
  width: 100vw;
  max-width: none;
  height: 100vh;
  max-height: none;
  margin: 0;
  padding: 18px;
  border-radius: 0;
  background: none;
  box-shadow: none;
  overflow: visible;
  z-index: 60;
  align-items: center;
  justify-content: center;
}

#bow-drawer.bow-modal:not(.bow-modal-open) {
  display: none !important;
}

#bow-drawer.bow-modal.bow-modal-open {
  display: flex !important;
  opacity: 1;
}

@keyframes bow-modal-pop {
  from { opacity: 0; transform: translateY(6px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.bow-modal-box {
  width: min(580px, calc(100vw - 28px));
  max-height: min(85vh, 740px);
  background: linear-gradient(175deg, #19212a 0%, #11161d 100%);
  border: 1px solid #33414f;
  border-top: 2px solid var(--bow-bordo);
  border-radius: 6px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  animation: bow-modal-pop 0.16s ease-out both;
  overflow: hidden;
}

.bow-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 18px;
  background: rgba(10, 14, 19, 0.55);
  border-bottom: 1px solid var(--bow-line-soft);
}

.bow-modal-head #bow-modal-title.bow-h2 {
  margin: 0;
  padding: 0;
  border: 0;
  font-size: 0.86rem;
  letter-spacing: 0.15em;
  color: var(--bow-silver);
}

#bow-body.bow-body-open #bow-drawer.bow-modal .bow-modal-body.bow-drawer-scroll,
#bow-drawer.bow-modal .bow-modal-body.bow-drawer-scroll {
  width: 100%;
  max-width: none;
  max-height: calc(min(85vh, 740px) - 56px);
  padding: 16px 18px 18px;
  overflow-y: auto;
}

/* Единая ровная квадратная кнопка закрытия ✕ во всех окнах */
.bow-dialog-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
