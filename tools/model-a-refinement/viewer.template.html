<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blades of War — модель А и колодец</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #161b20; color: #ebedf0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-width: 290px; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #39414a; background: #1a2027; }
  .mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #a4865c; border-radius: 8px; color: #d9bd91; font-weight: 800; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .035em; }
  .subtitle { margin: 3px 0 0; color: #aeb8c0; font-size: 12px; }
  .workspace { display: flex; flex: 1; min-height: 0; }
  .stage { min-width: 0; min-height: 0; position: relative; flex: 1; background: #232930; }
  #view { width: 100%; height: 100%; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint { position: absolute; left: 14px; bottom: 14px; pointer-events: none; padding: 7px 10px; border: 1px solid #4a525a; border-radius: 6px; background: #151b20d9; color: #c7cdd2; font-size: 11px; }
  aside { flex: 0 0 292px; overflow: auto; padding: 20px; background: #1b2229; border-left: 1px solid #39414a; }
  .eyebrow { color: #c7a875; font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: .12em; margin: 0 0 10px; }
  .group { margin-bottom: 24px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  button { font: inherit; font-size: 12px; color: #d9dfe3; background: #282f37; border: 1px solid #46505a; border-radius: 7px; padding: 10px 8px; cursor: pointer; min-height: 38px; }
  button:hover { border-color: #b99c70; background: #313942; }
  button.active { background: #705c41; border-color: #d3b783; color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid #f4d7a7; outline-offset: 2px; }
  button.wide { grid-column: 1 / -1; }
  label { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #d1d7db; cursor: pointer; }
  input { accent-color: #c5a375; }
  #status { font-size: 12px; color: #b8c1c7; line-height: 1.5; }
  #error { color: #ffc5b4; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
  .note { color: #929da5; font-size: 11px; line-height: 1.55; border-top: 1px solid #39414a; padding-top: 14px; }
  @media (max-width: 720px) {
    body { height: auto; min-height: 100dvh; }
    .workspace { display: block; }
    .stage { height: 61vh; min-height: 340px; }
    aside { border-left: 0; border-top: 1px solid #39414a; padding: 16px; }
    .group { margin-bottom: 17px; }
    .buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    button.wide { grid-column: auto; }
  }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">B</span>
  <div><h1>BLADES OF WAR</h1><p class="subtitle">Модель А и детализированный колодец</p></div>
</header>
<main class="workspace">
  <section class="stage" aria-label="Область 3D-просмотра">
    <div id="view"></div>
    <div class="hint">Мышь: вращение · колесо: масштаб · правая кнопка: сдвиг</div>
  </section>
  <aside aria-label="Настройки просмотра">
    <div class="group">
      <p class="eyebrow">Сцена</p>
      <div class="buttons">
        <button type="button" data-mode="female">Женщина А</button>
        <button type="button" data-mode="well">Колодец</button>
        <button type="button" data-mode="pair" class="wide">Вместе</button>
      </div>
    </div>
    <div class="group">
      <p class="eyebrow">Ракурс</p>
      <div class="buttons">
        <button type="button" data-view="front">Спереди</button>
        <button type="button" data-view="angle">Три четверти</button>
        <button type="button" data-view="side">Сбоку</button>
        <button type="button" data-view="back">Сзади</button>
        <button type="button" data-view="face" class="wide">Лицо крупно</button>
      </div>
    </div>
    <div class="group"><label><input type="checkbox" id="spin"> Автовращение камеры</label></div>
    <p id="status" role="status">Загрузка сцены…</p>
    <p id="error" role="alert"></p>
    <p class="note">Модель А и её ресницы статичны: скелета и анимации моргания в этой версии нет. Для просмотра сеть не нужна.</p>
  </aside>
</main>
<script type="module">
/*__ORIGINAL_WELL_AND_ENGINE_BUNDLE__*/
const FEMALE_URI = "__FEMALE_DATA_URI__";
const vpEl = document.querySelector('#view');
const scene = new Pn();
scene.background = new Y(0x232930);

// The latest showcase's lighting and detailed well are kept intact.
scene.add(new ks(0xf8efe8, 0x3b4452, 1.08));
const keyLight = new Js(0xfff5ec, 1.55);
keyLight.position.set(-2.6, 4.2, 4.8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);
const fillLight = new Js(0xc8dcf5, 0.72);
fillLight.position.set(3.2, 2.5, -2.0);
scene.add(fillLight);
const frontEyeLight = new Js(0xffffff, 0.38);
frontEyeLight.position.set(0.2, 1.9, 5.2);
scene.add(frontEyeLight);
const studioFloor = new X(new sa(2.6, 48).rotateX(-Math.PI * 0.5), new Uo({color: 0x1a2026}));
studioFloor.position.y = -0.002;
studioFloor.receiveShadow = true;
scene.add(studioFloor);

try {
  const renderer = new Dd({antialias: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = ze;
  renderer.shadowMap.enabled = true;
  vpEl.appendChild(renderer.domElement);
  const camera = new Vs(30, 1, 0.01, 100);
  const controls = new Hf(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  const female = (await new jd().loadAsync(FEMALE_URI)).scene;
  female.traverse(object => {
    if (object.isMesh) {
      object.castShadow = true;
      object.receiveShadow = false;
      object.frustumCulled = false;
    }
  });
  const wellProp = sp();
  scene.add(female, wellProp.group);
  const state = { mode: 'pair', view: 'front', spin: false, animateWell: true };

  function fit(height, width) {
    const aspect = Math.max(0.05, camera.aspect);
    const tan = Math.tan(camera.fov * Math.PI / 360);
    return Math.max(height / (2 * tan), width / (2 * tan * aspect)) * 1.14;
  }
  function applyMode() {
    const pair = state.mode === 'pair';
    female.visible = state.mode !== 'well';
    wellProp.group.visible = state.mode !== 'female';
    studioFloor.visible = state.mode === 'female';
    female.position.set(pair ? 1.0 : 0, 0, pair ? 0.15 : 0);
    female.rotation.set(0, 0, 0);
    wellProp.group.position.set(pair ? -0.7 : 0, 0, 0);
    const descriptions = {
      female: 'Женщина А · статичная модель',
      pair: 'Женщина А и детализированный колодец',
      well: 'Детализированный колодец из последней витрины',
    };
    document.querySelector('#status').textContent = descriptions[state.mode];
    document.querySelectorAll('[data-mode]').forEach(button => {
      const active = button.dataset.mode === state.mode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    document.querySelectorAll('[data-view]').forEach(button => {
      const active = button.dataset.view === state.view;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
  }
  function frameView() {
    const face = state.mode === 'female' && state.view === 'face';
    let center, width, height, depthAllowance;
    if (face) {
      center = [0, 1.56, 0.02]; width = 0.26; height = 0.34; depthAllowance = 0;
    } else if (state.mode === 'female') {
      center = [0, 0.85, 0]; width = 0.68; height = 1.85; depthAllowance = 0.15;
    } else if (state.mode === 'well') {
      center = [-0.10, 1.22, 0.08]; width = state.view === 'angle' ? 2.85 : 2.35; height = 2.5; depthAllowance = 1.20;
    } else {
      center = [-0.34, 1.22, 0.08]; width = state.view === 'angle' ? 3.75 : 3.25; height = 2.5; depthAllowance = 1.20;
    }
    // The well has substantial depth. Account for its diagonal width and near
    // side as well as height, otherwise the roof or snow can be cropped.
    const dist = fit(height, width) + depthAllowance;
    let dx = 0, dz = 1;
    if (state.view === 'angle') { dx = 0.50; dz = 0.8660254; }
    if (state.view === 'side') { dx = 1; dz = 0; }
    if (state.view === 'back') { dx = 0; dz = -1; }
    controls.target.set(...center);
    camera.position.set(center[0] + dist * dx, center[1] + (face ? 0.01 : 0.12), center[2] + dist * dz);
    controls.update();
  }
  function setMode(mode) {
    if (!['female', 'well', 'pair'].includes(mode)) return;
    state.mode = mode;
    state.view = 'front';
    applyMode();
    frameView();
  }
  function setView(view) {
    if (!['front', 'angle', 'side', 'back', 'face'].includes(view)) return;
    if (view === 'face') state.mode = 'female';
    state.view = view;
    applyMode();
    frameView();
  }
  document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
  document.querySelector('#spin').addEventListener('change', event => {
    state.spin = event.target.checked;
    controls.autoRotate = state.spin;
    controls.autoRotateSpeed = 1.0;
  });
  function resize() {
    const width = Math.max(1, vpEl.clientWidth), height = Math.max(1, vpEl.clientHeight);
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    frameView();
  }
  window.addEventListener('resize', resize);
  applyMode();
  resize();
  const start = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    if (state.animateWell && wellProp.pendulum) {
      const t = (now - start) * 0.001;
      wellProp.pendulum.rotation.z = Math.sin(t * 0.9) * 0.018;
      wellProp.pendulum.rotation.x = Math.cos(t * 0.65) * 0.010;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
  window.preview = { female, well: wellProp.group, wellProp, state, camera, controls, renderer, setMode, setView };
  window.ready = true;
} catch (error) {
  document.querySelector('#status').textContent = 'Не удалось загрузить сцену.';
  document.querySelector('#error').textContent = 'Проверьте поддержку WebGL и откройте распакованный файл в современном браузере. ' + (error?.message || error);
  throw error;
}
</script>
</body>
</html>
